apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencies {

    def v = "2.3.7.RELEASE"
    try {
        v = java.util.Optional.ofNullable(springBootVersion).orElse(v)
    } catch (MissingPropertyException e) {
    }
    println("springBootVersion = ${v}")

    implementation "org.springframework.boot:spring-boot-starter-web:${v}"
    implementation "org.springframework.boot:spring-boot-starter-aop:${v}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${v}"

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    api group: 'org.projectlombok', name: 'lombok', version: '1.18.30'

    api project(':core')
}

test {
    // 使用 JUnit Platform 运行 JUnit 5（jupiter）测试；vintage 引擎可兼容 JUnit 4 测试
    useJUnitPlatform()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

bootJar {
    archiveBaseName = 'test-application'
}