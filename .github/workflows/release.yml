name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CENTRAL_PUBLISHING_TYPE: ${{ vars.CENTRAL_PUBLISHING_TYPE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches project version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          TAG="${GITHUB_REF_NAME#v}"
          echo "project_version=$VERSION"
          echo "tag=$GITHUB_REF_NAME"
          case "$VERSION" in
            *-SNAPSHOT)
              echo "::error::SNAPSHOT versions cannot be published to Maven Central"
              exit 1
              ;;
          esac
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          fi

      - name: Build, test and sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?SIGNING_KEY repository secret is required}"
          : "${SIGNING_PASSWORD:?SIGNING_PASSWORD repository secret is required}"
          chmod +x gradlew
          ./gradlew --no-daemon :test:test :core:publishAndZip

      - name: Publish to Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CENTRAL_USERNAME:?CENTRAL_USERNAME repository secret is required}"
          : "${CENTRAL_PASSWORD:?CENTRAL_PASSWORD repository secret is required}"
          chmod +x gradlew
          ./gradlew --no-daemon :core:publishToCentralPortal

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: core/build/http-raw-log-*.zip
          if-no-files-found: warn
