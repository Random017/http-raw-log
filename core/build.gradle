//            }
//        }
//    }

    repositories {
        maven {
            // build 目录下的 repo 目录
            url = layout.buildDirectory.dir('repo')
        }
    }
}

// 签名支持两种来源，优先级：in-memory > keyring。
// 1) CI/临时：-PsigningKey/-PsigningPassword，或环境变量 SIGNING_KEY/SIGNING_PASSWORD；
// 2) 本机：~/.gradle/gradle.properties 中的标准 signing.keyId / signing.password / signing.secretKeyRingFile。
def inMemorySigningKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
def inMemorySigningPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
def keyRingFile = findProperty('signing.secretKeyRingFile')
def keyRingKeyId = findProperty('signing.keyId')
def keyRingPassword = findProperty('signing.password')

def hasInMemorySigning = inMemorySigningKey && inMemorySigningPassword
def hasKeyRingSigning = keyRingFile && keyRingKeyId && keyRingPassword && file(keyRingFile).isFile()
def signingConfigured = hasInMemorySigning || hasKeyRingSigning

if (signingConfigured) {
    apply plugin: 'signing'
    signing {
        if (hasInMemorySigning) {
            useInMemoryPgpKeys(inMemorySigningKey.toString(), inMemorySigningPassword.toString())
        }
        // keyring 模式不传 signatory，signing 插件自动读取
        // signing.keyId / signing.password / signing.secretKeyRingFile
        sign publishing.publications.mavenJava
    }
} else if (keyRingFile || keyRingKeyId || keyRingPassword) {
    logger.warn('signing is skipped: signing.keyId/signing.password/signing.secretKeyRingFile ' +
            'are incomplete or the secret key ring file does not exist')
} else {
    logger.lifecycle('signing is skipped: configure signing.* in ~/.gradle/gradle.properties, ' +
            'or set signingKey/signingPassword or SIGNING_KEY/SIGNING_PASSWORD')
}

def isReleaseVersion(version) {
    return !version.endsWith("-SNAPSHOT")
}

// 官方配置： https://central.sonatype.org/publish/publish-gradle/

/**
 * 打包并发布到本地 Maven 仓库，然后将 com 目录打成 zip
 * 用法: ./gradlew :core:publishAndZip
 */
task publishAndZip {
    description = 'Clean, publish to local repo, then zip the com directory for Maven Central upload'
    group = 'publishing'

    dependsOn 'clean', 'publish'

    doLast {
        // 将 build/repo/com 目录打成 zip
        def repoDir = layout.buildDirectory.dir('repo').get().asFile
        def zipFile = layout.buildDirectory.file("http-raw-log-${project.version}.zip").get().asFile

        if (repoDir.exists()) {
            def signedFiles = fileTree(repoDir).matching { include '**/*.asc' }.files
            ant.zip(destfile: zipFile) {
                fileset(dir: repoDir)
            }
            if (signedFiles.isEmpty()) {
                println "⚠️ 未生成 .asc：Maven Central 会拒绝该 zip；请配置 ~/.gradle/gradle.properties 的 signing.*，" +
                        "或设置 SIGNING_KEY/SIGNING_PASSWORD 后重试"
            } else {
                println "🔏 已生成 ${signedFiles.size()} 个签名文件"
            }
            println "✅ ZIP 已生成: ${zipFile.absolutePath}"
            println "📦 请上传到 https://central.sonatype.com/publish"
        } else {
            println "❌ 目录不存在: ${repoDir.absolutePath}"
        }
    }
}
