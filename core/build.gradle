apply plugin: 'maven-publish'

def bootVersion = "3.2.5"
try {
    bootVersion = java.util.Optional.ofNullable(springBootVersion).orElse(bootVersion)
} catch (MissingPropertyException e) {
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:${bootVersion}"
    // 仅编译期需要；运行期由宿主应用的 Spring Boot 提供
    compileOnly "org.springframework.boot:spring-boot-starter-web:${bootVersion}"
}

// 给 JPMS 使用方一个稳定的自动模块名，避免用 jar 文件名推导
jar {
    manifest {
        attributes('Automatic-Module-Name': 'com.skycong.httprawlog')
    }
}

def coreArtifactId = "http-raw-log"


publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId coreArtifactId
            version project.version
            from components.java

            pom {
                name = 'skycong http raw log kit'
                description = ' print http raw log'
                url = 'https://github.com/Random017/http-raw-log'
                properties = [
                        springBootVersion: bootVersion
                ]
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'rmc'
                        name = 'rmc'
                        email = 'mc@skycong.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Random017/http-raw-log'
                    developerConnection = 'scm:git:https://github.com/Random017/http-raw-log.git'
                    url = 'https://github.com/Random017/http-raw-log'
                }
                // compileOnly 不会进入 POM，这里显式声明为 provided + optional，
                // 避免使用方只拿到一个“零依赖”的 jar 后在编译/IDE 中缺类。
                withXml {
                    def root = asNode()
                    def dependenciesNode = root.children().find { it.name() == 'dependencies' }
                    def deps = dependenciesNode ?: root.appendNode('dependencies')
                    def dependency = deps.appendNode('dependency')
                    dependency.appendNode('groupId', 'org.springframework.boot')
                    dependency.appendNode('artifactId', 'spring-boot-starter-web')
                    dependency.appendNode('version', bootVersion)
                    dependency.appendNode('scope', 'provided')
                    dependency.appendNode('optional', 'true')
                }
            }
        }
    }

