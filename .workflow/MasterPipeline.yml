version: '1.0'
name: master-pipeline
displayName: MasterPipeline
stages:
  - stage:
    name: build
    displayName: 构建与测试
    steps:
      - step: build@maven
        name: build_gradle
        displayName: Gradle 17 构建
        # Spring Boot 3.x 需要 JDK 17+；这里只借用构建环境，实际构建使用 Gradle Wrapper
        jdkVersion: 17
        mavenVersion: 3.3.9
        commands:
          - chmod +x gradlew
          - ./gradlew --no-daemon :test:test :core:build
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - core/build/libs
  - stage:
    name: publish
    displayName: 上传制品
    steps:
      - step: publish@general_artifacts
        name: publish_general_artifacts
        displayName: 上传构建产物
        dependArtifact: BUILD_ARTIFACT
        artifactName: output
